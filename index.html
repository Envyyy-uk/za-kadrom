  <div class="eyebrow"><b></b>Подкаст · Лондон · для команди</div>
  <h1>«За кадром»: що є, чого бракує, хто що робить</h1>
  <p class="lead">Одна сторінка для SMM, відеографа і монтажера. Тут написано, що вже готово, що ще треба знайти чи купити і чого ми свідомо не робимо. Нижче описано, хто за що відповідає і як іде випуск від зйомки до публікації.</p>
</header>

<main class="wrap">
<section id="stan">
  <h2>Що є і чого нема</h2>
  <p class="hint">Стан на <span id="upd"></span>. Сторінку оновлює ведучий. Якщо тут написано «уточнити», напиши ведучому: ці речі ще не вирішені.</p>
  <div class="counts" id="counts"></div>
  <div class="legend">
    <span><span class="pill s-have">Є</span> вже готово</span>
    <span><span class="pill s-need">Треба</span> потрібно до першої зйомки</span>
    <span><span class="pill s-later">Пізніше</span> після пілоту</span>
    <span><span class="pill s-ask">Уточнити</span> ще не вирішено</span>
    <span><span class="pill s-skip">Не треба</span> свідомо не робимо</span>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Фільтр за статусом"></div>
  <div id="list"></div>
  <div id="editslot"></div>
</section>

<section id="proekt">
  <h2>Про проєкт за 30 секунд</h2>
  <div class="cards">
    <div class="card"><h3>Що це</h3><p>Розмовний подкаст з українцями в Лондоні: власники закладів, студенти, музиканти, креатори. Говоримо про шлях людини і про те, що зазвичай лишається за кадром.</p></div>
    <div class="card"><h3>Тривалість</h3><p>Запис 45–65 хв, після монтажу 30–45 хв. З кожного випуску ще 5–8 коротких кліпів.</p></div>
    <div class="card"><h3>Тон</h3><p>Тепло, чесно, без жовтизни. Від Гордона беремо підготовку до гостя, від Дудя динаміку і монтаж, від Тимошенка легкість.</p></div>
    <div class="card"><h3>Пілот</h3><p>4 гості: власники Podval × Haze, Маша (кіно і TikTok), Настя (LSE), DJ Настя Eif. Сценарії на всіх чотирьох уже готові.</p></div>
  </div>
</section>

<section id="roli">
  <h2>Хто що робить</h2>
  <p class="hint">Кожен відповідає за свою частину і віддає результат далі в домовлений термін.</p>
  <div class="cards">
    <div class="card"><div class="role">Ведучий</div><h3>Гості, сценарій, розмова</h3>
      <ul><li>Домовляється з гостем і локацією, отримує дозвіл знімати.</li><li>Готує сценарій і питання на сайті-студії.</li><li>Веде запис і стежить за таймінгом.</li><li>Останнім затверджує монтаж і тексти.</li></ul>
      <p class="out"><b>Віддає:</b> дату, адресу, сценарій і список кліпових моментів за 3 дні до зйомки.</p></div>
    <div class="card"><div class="role">Відеограф</div><h3>Картинка і звук</h3>
      <ul><li>Ставить камери, світло і петлички.</li><li>Пише звук на кожного окремо.</li><li>Знімає перебивки: заклад, руки, деталі.</li><li>Того ж дня скидає всі файли в спільну папку.</li></ul>
      <p class="out"><b>Віддає:</b> сирі відео і звук у день зйомки.</p></div>
    <div class="card"><div class="role">Монтажер</div><h3>Повний випуск і кліпи</h3>
      <ul><li>Синхронізує камери і звук, чистить шум.</li><li>Збирає холодний старт, повний випуск і кліпи.</li><li>Робить субтитри до вертикальних кліпів.</li></ul>
      <p class="out"><b>Віддає:</b> повний випуск за 7 днів, кліпи за 10 днів після зйомки.</p></div>
    <div class="card"><div class="role">SMM</div><h3>Публікації і аудиторія</h3>
      <ul><li>Пише назви, описи, підписи і готує обкладинки.</li><li>Веде графік публікацій на всіх платформах.</li><li>Відмічає гостя і заклад, відповідає на коментарі.</li><li>Раз на тиждень коротко звітує: що зайшло, а що ні.</li></ul>
      <p class="out"><b>Віддає:</b> план постів за 2 дні до виходу випуску.</p></div>
  </div>
  <p class="hint" style="margin-top:14px">Якщо одна людина знімає і монтує, на неї просто лягають обидві ролі. Терміни лишаються ті самі.</p>
</section>

<section id="video">
  <h2>Бриф відеографу</h2>
  <div class="brief"><div class="lbl">Кадр</div><ul>
    <li>Дві камери: загальний план (ведучий і гість) і крупний план гостя.</li>
    <li>Третя камера в руках, тільки на рубрику: коктейль, музика, показ чогось.</li>
    <li>На всіх камерах однакова частота кадрів і баланс білого. Роздільність 4K, якщо камера тягне, якщо ні, то 1080p.</li>
    <li>Гостя тримай ближче до центру кадру: з горизонтального відео потім вирізатимемо вертикальні кліпи.</li></ul></div>
  <div class="brief"><div class="lbl">Світло</div><ul>
    <li>Тепле, м'яке, без верхнього денного світла в обличчя.</li>
    <li>Фон має бути видно: бар, сцена, кімната. Глядач повинен розуміти, де ми.</li></ul></div>
  <div class="brief"><div class="lbl">Звук</div><ul>
    <li>Петличка на кожного, хто говорить. Власників троє, тож потрібно 4 петлички разом з ведучим.</li>
    <li>На початку запиши 10 секунд тиші в приміщенні: за нею монтажер чистить шум.</li>
    <li>Плесни в долоні в кадрі на старті: так легше синхронізувати камери.</li>
    <li>Під час музичної рубрики пиши звук з пульта окремо, якщо є лінійний вихід.</li></ul></div>
  <div class="brief"><div class="lbl">Файли</div><ul>
    <li>Назва папки: <code>дата_гість</code>, наприклад <code>2026-12-05_podval</code>. Усередині папки <code>cam-a</code>, <code>cam-b</code>, <code>audio</code>, <code>broll</code>.</li>
    <li>Візьми запасні карти пам'яті і заряджені батареї. Нічого не видаляй з карт, доки файли не лежать у спільній папці.</li></ul></div>
</section>

<section id="smm">
  <h2>Бриф SMM</h2>
  <div class="brief"><div class="lbl">Де виходимо</div><ul>
    <li>YouTube: повний випуск і Shorts.</li>
    <li>TikTok та Instagram Reels: вертикальні кліпи.</li>
    <li>Телеграм: анонс і посилання.</li></ul></div>
  <div class="brief"><div class="lbl">Ритм на старті</div><ul>
    <li>Повний випуск раз на два тижні.</li>
    <li>3–4 кліпи на тиждень, перший у день виходу випуску.</li>
    <li>Анонс гостя за 2–3 дні до виходу.</li></ul></div>
  <div class="brief"><div class="lbl">Правила</div><ul>
    <li>Відмічай гостя і заклад у кожному пості.</li>
    <li>Чужі пісні тримай до 10–15 секунд або приглушуй, інакше платформа може заблокувати відео.</li>
    <li>Алкоголь у кліпах: показуємо, як готують напій, і назву, а не саме пиття. TikTok гірше показує відео, де п'ють.</li>
    <li>Підпис до кліпу: одна фраза з розмови і питання до глядача. Хештеги не обов'язкові.</li>
    <li>Перед публікацією покажи текст ведучому. Гостю за бажанням: якщо він попросив, обов'язково.</li></ul></div>
</section>

<section id="proces">
  <h2>Як іде один випуск</h2>
  <ol class="steps">
    <li><div><h3>Підготовка</h3>Гість, локація, дата, сценарій. Відеограф отримує адресу і план.<div class="who">Ведучий · за 3–7 днів</div></div></li>
    <li><div><h3>Зйомка</h3>Сетап займає годину, запис ще годину. Після запису перебивки і фото гостя для обкладинки.<div class="who">Ведучий + відеограф · день зйомки</div></div></li>
    <li><div><h3>Файли</h3>Усе в спільну папку того ж вечора.<div class="who">Відеограф · день зйомки</div></div></li>
    <li><div><h3>Монтаж</h3>Спершу повний випуск, далі кліпи. Ведучий дивиться чорновик і пише правки одним списком.<div class="who">Монтажер · 7–10 днів</div></div></li>
    <li><div><h3>Перевірка гостем</h3>Тільки якщо гість просив: показуємо фінальну версію до виходу.<div class="who">Ведучий · 1–2 дні</div></div></li>
    <li><div><h3>Публікація</h3>Обкладинка, назва, опис, таймкоди і посилання на гостя. Анонс у всіх соцмережах.<div class="who">SMM · день виходу</div></div></li>
    <li><div><h3>Кліпи і звіт</h3>Кліпи за графіком два тижні. Через тиждень коротко: перегляди, що зайшло, що змінити.<div class="who">SMM · 2 тижні</div></div></li>
  </ol>
</section>

<section id="ne-robymo">
  <h2>Чого ми свідомо не робимо</h2>
  <p class="hint">Щоб не витрачати час і гроші на те, що зараз не допоможе.</p>
  <div class="cards">
    <div class="card"><h3><span class="no">✕</span> Не орендуємо студію</h3><p>Знімаємо там, де живе гість: у барі, вдома, на сцені. Місце стає частиною історії.</p></div>
    <div class="card"><h3><span class="no">✕</span> Не купуємо кінокамери</h3><p>Для старту вистачить двох нормальних камер або телефонів, доброго світла і петличок. Звук важливіший за картинку.</p></div>
    <div class="card"><h3><span class="no">✕</span> Не постимо щодня</h3><p>Краще 3–4 сильні кліпи на тиждень, ніж щодня абищо.</p></div>
    <div class="card"><h3><span class="no">✕</span> Не запускаємо рекламу на старті</h3><p>Спершу дивимося, які випуски і кліпи заходять самі.</p></div>
    <div class="card"><h3><span class="no">✕</span> Не робимо трьохгодинних випусків</h3><p>Новий глядач має дійти до кінця, тому тримаємося 30–45 хвилин.</p></div>
    <div class="card"><h3><span class="no">✕</span> Не шукаємо скандалів</h3><p>Гострі питання ставимо, але гостя не підставляємо. Хочемо, щоб наступні гості приходили самі.</p></div>
  </div>
</section>

<section id="lynky">
  <h2>Посилання</h2>

<script id="page-script">
(function(){

let state;

let filter="all",editing=false,dirty=false,saving=false,api=null;

const $=id=>document.getElementById(id);
const el=(tag,attrs,...kids)=>{const n=document.createElement(tag);for(const k in attrs||{}){if(k==="class")n.className=attrs[k];else if(k==="text")n.textContent=attrs[k];else n.setAttribute(k,attrs[k])}kids.forEach(c=>c&&n.append(c));return n};
function fmtDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");if(!m)return"—";const mon=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];return +m[3]+" "+mon[+m[2]-1]+" "+m[1]}
function render(){
  $("upd").textContent=fmtDate(state.updated);

  ORDER.forEach(s=>{const n=state.items.filter(i=>i.status===s).length;const d=el("div",{class:"count"});const st=el("strong",{text:String(n)});st.style.color=COLOR[s];d.append(st,el("span",{text:ST[s]}));c.append(d)});
  const f=$("filters");f.replaceChildren();

        sel.onchange=()=>{i.status=sel.value;markDirty();render()};
        const note=el("input",{id:"nt-"+i.id,type:"text",placeholder:"Примітка (необов'язково)",value:i.note,"aria-label":"Примітка: "+i.name,maxlength:"200"});

        er.append(sel,note,del);row.append(er);

function markDirty(){dirty=true;const m=$("emsg");if(m)m.textContent="Є незбережені зміни"}

  r.append(nm,ct,st);

  add.append(r,dl,wy,ab);slot.append(add);

}

}
